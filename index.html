<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Librería para permitir gestos táctiles (rotar y escalar con los dedos) -->
    <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector/dist/aframe-gesture-detector.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gesture-detector>

      <a-assets>
        <!-- Cargar tu modelo 3D en formato GLB o GLTF -->
        <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Cuando detecte el póster, muestra el modelo 3D -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#miModelo" 
          position="0 0 0.1" 
          scale="0.5 0.5 0.5" 
          rotation="90 0 0"
          class="clickable"
          gesture-handler="minScale: 0.1; maxScale: 5">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
