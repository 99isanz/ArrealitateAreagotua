<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- A-Frame 1.5.0 + MindAR 1.2.5 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // 3D eredua kudeatzeko gestuen osagaia (Touch Gestures)
      AFRAME.registerComponent('touch-gestures', {
        schema: {
          rotationFactor: { default: 6 },
          minScale: { default: 0.1 },
          maxScale: { default: 10 },
          panFactor: { default: 0.02 },
          maxDeltaPerEvent: { default: 30 }
        },

        init: function () {
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;

          this.lastX = 0;
          this.lastY = 0;
          this.lastDistance = null;
          this.lastCenter = null;

          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);

          // Target 0 (3D eredua) detektatzen denean soilik aktibatu gestuak
          const targetEntity = document.querySelector('#target-modelo');
          if (targetEntity) {
            targetEntity.addEventListener('targetFound', () => { this.isVisible = true; });
            targetEntity.addEventListener('targetLost', () => { this.isVisible = false; });
          }

          const sceneEl = this.el.sceneEl;
          if (sceneEl.hasLoaded) {
            this.attachTouchListeners();
          } else {
            sceneEl.addEventListener('loaded', () => this.attachTouchListeners());
          }
        },

        attachTouchListeners: function () {
          const canvas = this.el.sceneEl.canvas;
          canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
          canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
        },

        onTouchStart: function (event) {
          if (event.touches.length === 1) {
            this.lastX = event.touches[0].clientX;
            this.lastY = event.touches[0].clientY;
          } else if (event.touches.length === 2) {
            this.lastDistance = this.getDistance(event.touches);
            this.lastCenter = this.getCenter(event.touches);
          }
        },

        onTouchMove: function (event) {
          event.preventDefault();

          if (event.touches.length === 1) {
            const x = event.touches[0].clientX;
            const y = event.touches[0].clientY;

            if (this.isVisible) {
              const deltaX = this.clampDelta(x - this.lastX);
              const deltaY = this.clampDelta(y - this.lastY);
              this.el.object3D.rotation.y += deltaX * (this.data.rotationFactor / 1000);
              this.el.object3D.rotation.x += deltaY * (this.data.rotationFactor / 1000);
            }

            this.lastX = x;
            this.lastY = y;
          } else if (event.touches.length === 2) {
            const distance = this.getDistance(event.touches);
            const center = this.getCenter(event.touches);

            if (this.isVisible) {
              if (this.lastDistance !== null) {
                const delta = this.clampDelta(distance - this.lastDistance);
                this.scaleFactor *= 1 + delta / 200;
                this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);

                this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
                this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
                this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
              }

              if (this.lastCenter !== null) {
                const deltaX = this.clampDelta(center.x - this.lastCenter.x);
                const deltaY = this.clampDelta(center.y - this.lastCenter.y);

                this.el.object3D.position.x += deltaX * this.data.panFactor;
                this.el.object3D.position.y -= deltaY * this.data.panFactor;

                const maxOffset = 1;
                this.el.object3D.position.x = Math.min(Math.max(this.el.object3D.position.x, -maxOffset), maxOffset);
                this.el.object3D.position.y = Math.min(Math.max(this.el.object3D.position.y, -maxOffset), maxOffset);
              }
            }

            this.lastDistance = distance;
            this.lastCenter = center;
          }
        },

        getDistance: function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        },

        getCenter: function (touches) {
          return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
          };
        },

        clampDelta: function (delta) {
          const max = this.data.maxDeltaPerEvent;
          return Math.min(Math.max(delta, -max), max);
        }
      });

      // Bideoaren erreproduzitzailea kudeatzeko osagaia (kartela)
      AFRAME.registerComponent('video-handler', {
        init: function () {
          const video = document.querySelector('#kartel-bideoa');

          this.el.addEventListener('targetFound', () => {
            video.play().catch(err => {
              console.log("Autoplay blokeatuta egon daiteke, erabiltzaileak pantaila ukitzea behar du:", err);
            });
          });

          this.el.addEventListener('targetLost', () => {
            video.pause();
          });
        }
      });

      // CM / DM modua kudeatzeko osagaia (bi "gif" bezala erabilitako bideoak)
      AFRAME.registerComponent('modo-handler', {
        init: function () {
          this.currentMode = 'cm'; // modu lehenetsia
          this.videoCM = document.querySelector('#video-cm');
          this.videoDM = document.querySelector('#video-dm');
          this.planeCM = document.querySelector('#plane-cm');
          this.planeDM = document.querySelector('#plane-dm');
          this.buttons = document.querySelector('#modo-botoiak');

          this.el.addEventListener('targetFound', () => {
            this.buttons.style.display = 'flex';
            this.showMode(this.currentMode);
          });

          this.el.addEventListener('targetLost', () => {
            this.buttons.style.display = 'none';
            this.videoCM.pause();
            this.videoDM.pause();
          });
        },

        showMode: function (mode) {
          this.currentMode = mode;

          if (mode === 'cm') {
            this.planeCM.setAttribute('visible', true);
            this.planeDM.setAttribute('visible', false);
            this.videoDM.pause();
            this.videoCM.currentTime = 0;
            this.videoCM.play().catch(() => {});
          } else {
            this.planeCM.setAttribute('visible', false);
            this.planeDM.setAttribute('visible', true);
            this.videoCM.pause();
            this.videoDM.currentTime = 0;
            this.videoDM.play().catch(() => {});
          }
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      * { touch-action: none; }

      #modo-botoiak {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 0;
        right: 0;
        justify-content: center;
        gap: 16px;
        z-index: 999;
        touch-action: auto;
      }

      #modo-botoiak button {
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.85);
        color: #222;
        touch-action: auto;
      }

      #modo-botoiak button.activo {
        background: #2b7cff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
        <video id="kartel-bideoa" src="./bideoa.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-cm" src="./cm.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-dm" src="./dm.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-light type="directional" position="1 2 1" intensity="1.0"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: 3D Eredua -->
      <a-entity id="target-modelo" mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#miModelo"
          position="0 0 0"
          scale="0.01 0.01 0.01"
          rotation="0 0 0"
          touch-gestures="rotationFactor: 6; minScale: 0.1; maxScale: 10; panFactor: 0.02">
        </a-gltf-model>
      </a-entity>

      <!-- Target 1: Bideoa (kartela) -->
      <a-entity id="target-bideoa" mindar-image-target="targetIndex: 1" video-handler>
        <a-video src="#kartel-bideoa" width="1" height="0.552" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2: CM / DM modua (bi "gif" bideo gisa) -->
      <a-entity id="target-modo" mindar-image-target="targetIndex: 2" modo-handler>
        <a-video id="plane-cm" src="#video-cm" width="3" height="1.656" position="0 0 0" rotation="0 0 0" visible="true"></a-video>
        <a-video id="plane-dm" src="#video-dm" width="3" height="1.656" position="0 0 0" rotation="0 0 0" visible="false"></a-video>
      </a-entity>

    </a-scene>

    <!-- CM / DM botoiak, AR eszenaren gainean -->
    <div id="modo-botoiak">
      <button id="btn-cm" class="activo">CM</button>
      <button id="btn-dm">DM</button>
    </div>

    <script>
      // Pantailan klik egitean bideoaren audioa desblokeatzeko laguntzailea (kartela)
      document.body.addEventListener('click', () => {
        const video = document.querySelector('#kartel-bideoa');
        if (video && video.paused) {
          const targetBideoa = document.querySelector('#target-bideoa');
          if (targetBideoa && targetBideoa.object3D.visible) {
            video.play();
          }
        }
      });

      // CM / DM botoien kudeaketa
      document.addEventListener('DOMContentLoaded', () => {
        const btnCM = document.querySelector('#btn-cm');
        const btnDM = document.querySelector('#btn-dm');
        const targetModo = document.querySelector('#target-modo');

        btnCM.addEventListener('click', () => {
          targetModo.components['modo-handler'].showMode('cm');
          btnCM.classList.add('activo');
          btnDM.classList.remove('activo');
        });

        btnDM.addEventListener('click', () => {
          targetModo.components['modo-handler'].showMode('dm');
          btnDM.classList.add('activo');
          btnCM.classList.remove('activo');
        });
      });
    </script>
  </body>
</html>
