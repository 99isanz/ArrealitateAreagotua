<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- A-Frame 1.5.0 + MindAR 1.2.5 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // 3D eredua kudeatzeko gestuen osagaia (biratu + eskalatu + mugitu)
      AFRAME.registerComponent('touch-gestures', {
        schema: {
          rotationFactor: { default: 6 },
          minScale: { default: 0.1 },
          maxScale: { default: 10 },
          panFactor: { default: 0.02 },
          maxDeltaPerEvent: { default: 30 },
          targetSelector: { default: '#target-modelo' }
        },

        init: function () {
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;

          this.lastX = 0;
          this.lastY = 0;
          this.lastDistance = null;
          this.lastCenter = null;

          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);

          const targetEntity = document.querySelector(this.data.targetSelector);
          if (targetEntity) {
            targetEntity.addEventListener('targetFound', () => { this.isVisible = true; });
            targetEntity.addEventListener('targetLost', () => { this.isVisible = false; });
          }

          const sceneEl = this.el.sceneEl;
          if (sceneEl.hasLoaded) {
            this.attachTouchListeners();
          } else {
            sceneEl.addEventListener('loaded', () => this.attachTouchListeners());
          }
        },

        attachTouchListeners: function () {
          const canvas = this.el.sceneEl.canvas;
          canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
          canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
        },

        active: function () {
          return this.isVisible && this.el.object3D.visible;
        },

        onTouchStart: function (event) {
          if (event.touches.length === 1) {
            this.lastX = event.touches[0].clientX;
            this.lastY = event.touches[0].clientY;
          } else if (event.touches.length === 2) {
            this.lastDistance = this.getDistance(event.touches);
            this.lastCenter = this.getCenter(event.touches);
          }
        },

        onTouchMove: function (event) {
          event.preventDefault();

          if (event.touches.length === 1) {
            const x = event.touches[0].clientX;
            const y = event.touches[0].clientY;

            if (this.active()) {
              const deltaX = this.clampDelta(x - this.lastX);
              const deltaY = this.clampDelta(y - this.lastY);
              this.el.object3D.rotation.y += deltaX * (this.data.rotationFactor / 1000);
              this.el.object3D.rotation.x += deltaY * (this.data.rotationFactor / 1000);
            }

            this.lastX = x;
            this.lastY = y;
          } else if (event.touches.length === 2) {
            const distance = this.getDistance(event.touches);
            const center = this.getCenter(event.touches);

            if (this.active()) {
              if (this.lastDistance !== null) {
                const delta = this.clampDelta(distance - this.lastDistance);
                this.scaleFactor *= 1 + delta / 200;
                this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);

                this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
                this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
                this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
              }

              if (this.lastCenter !== null) {
                const deltaX = this.clampDelta(center.x - this.lastCenter.x);
                const deltaY = this.clampDelta(center.y - this.lastCenter.y);

                this.el.object3D.position.x += deltaX * this.data.panFactor;
                this.el.object3D.position.y -= deltaY * this.data.panFactor;

                const maxOffset = 1;
                this.el.object3D.position.x = Math.min(Math.max(this.el.object3D.position.x, -maxOffset), maxOffset);
                this.el.object3D.position.y = Math.min(Math.max(this.el.object3D.position.y, -maxOffset), maxOffset);
              }
            }

            this.lastDistance = distance;
            this.lastCenter = center;
          }
        },

        getDistance: function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        },

        getCenter: function (touches) {
          return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
          };
        },

        clampDelta: function (delta) {
          const max = this.data.maxDeltaPerEvent;
          return Math.min(Math.max(delta, -max), max);
        }
      });

      // Bideo/argazkietarako osagaia: bi hatzeko pellizkoarekin eskalatu
      // eta bi hatzekin arrastatuta gora/behera (eta alboetara) mugitu.
      // Ez du hatz bakarreko biraketarik (bideoak/argazkiak ez dira biratu behar).
      AFRAME.registerComponent('pinch-scale', {
        schema: {
          minScale: { default: 0.3 },
          maxScale: { default: 5 },
          maxDeltaPerEvent: { default: 30 },
          panFactor: { default: 0.02 },
          targetSelector: { default: '' }
        },

        init: function () {
          this.isVisible = false;
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;
          this.lastDistance = null;
          this.lastCenter = null;

          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);

          if (this.data.targetSelector) {
            const targetEntity = document.querySelector(this.data.targetSelector);
            if (targetEntity) {
              targetEntity.addEventListener('targetFound', () => { this.isVisible = true; });
              targetEntity.addEventListener('targetLost', () => { this.isVisible = false; });
            }
          }

          const sceneEl = this.el.sceneEl;
          if (sceneEl.hasLoaded) {
            this.attachTouchListeners();
          } else {
            sceneEl.addEventListener('loaded', () => this.attachTouchListeners());
          }
        },

        attachTouchListeners: function () {
          const canvas = this.el.sceneEl.canvas;
          canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
          canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
        },

        active: function () {
          return this.isVisible && this.el.object3D.visible;
        },

        onTouchStart: function (event) {
          if (event.touches.length === 2) {
            this.lastDistance = this.getDistance(event.touches);
            this.lastCenter = this.getCenter(event.touches);
          }
        },

        onTouchMove: function (event) {
          if (event.touches.length !== 2) return;
          event.preventDefault();

          const distance = this.getDistance(event.touches);
          const center = this.getCenter(event.touches);
          const max = this.data.maxDeltaPerEvent;

          if (this.active()) {
            if (this.lastDistance !== null) {
              const delta = Math.min(Math.max(distance - this.lastDistance, -max), max);

              this.scaleFactor *= 1 + delta / 200;
              this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);

              this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
              this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
              this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
            }

            if (this.lastCenter !== null) {
              const deltaX = Math.min(Math.max(center.x - this.lastCenter.x, -max), max);
              const deltaY = Math.min(Math.max(center.y - this.lastCenter.y, -max), max);

              this.el.object3D.position.x += deltaX * this.data.panFactor;
              this.el.object3D.position.y -= deltaY * this.data.panFactor;

              const maxOffset = 1;
              this.el.object3D.position.x = Math.min(Math.max(this.el.object3D.position.x, -maxOffset), maxOffset);
              this.el.object3D.position.y = Math.min(Math.max(this.el.object3D.position.y, -maxOffset), maxOffset);
            }
          }

          this.lastDistance = distance;
          this.lastCenter = center;
        },

        getDistance: function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        },

        getCenter: function (touches) {
          return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
          };
        }
      });

      // Bideo/argazki lauak beti kamerari begira mantentzeko osagaia.
      // Horrela, marker-aren angelua aldatu arren, panela ez da okertzen/biratzen;
      // erabiltzaileak pellizkoarekin/arrastatuz eginiko aldaketak bakarrik ikusiko dira.
      AFRAME.registerComponent('billboard', {
        tick: function () {
          const cameraObj = this.el.sceneEl.camera;
          const parent = this.el.object3D.parent;
          if (!cameraObj || !parent) return;

          const camWorldQuat = new THREE.Quaternion();
          cameraObj.getWorldQuaternion(camWorldQuat);

          const parentWorldQuat = new THREE.Quaternion();
          parent.getWorldQuaternion(parentWorldQuat);

          const localQuat = parentWorldQuat.clone().invert().multiply(camWorldQuat);
          this.el.object3D.quaternion.copy(localQuat);
        }
      });

      // Eredu bat automatikoki erdiratzeko osagaia (pibotea ez badago
      // ereduaren benetako erdigunean, adib. Cond.glb edo EMIFilter.glb)
      AFRAME.registerComponent('center-model', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            try {
              const mesh = this.el.getObject3D('mesh');
              if (!mesh) return;

              const box = new THREE.Box3().setFromObject(mesh);
              const center = box.getCenter(new THREE.Vector3());

              // Balio baliogabeak badira (NaN/Infinity), ez ukitu ereduaren posizioa
              if (!isFinite(center.x) || !isFinite(center.y) || !isFinite(center.z)) {
                console.warn('center-model: erdigune baliogabea, ez da zuzendu.', this.el.id || this.el);
                return;
              }

              mesh.position.x -= center.x;
              mesh.position.y -= center.y;
              mesh.position.z -= center.z;
            } catch (err) {
              console.warn('center-model: errorea erdiratzean, jatorrizko posizioari eutsiko zaio.', err);
            }
          });
        }
      });

      // Bideo soil bat targetFound/targetLost-ekin erreproduzitzeko osagaia (target 0)
      AFRAME.registerComponent('video-handler', {
        schema: {
          videoSelector: { default: '' }
        },
        init: function () {
          this.video = document.querySelector(this.data.videoSelector);

          this.el.addEventListener('targetFound', () => {
            if (this.video) {
              this.video.play().catch(err => {
                console.log("Autoplay blokeatuta egon daiteke, erabiltzaileak pantaila ukitzea behar du:", err);
              });
            }
          });

          this.el.addEventListener('targetLost', () => {
            if (this.video) this.video.pause();
          });
        }
      });

      // Bi aukeraren artean aukeratzeko osagai orokorra
      AFRAME.registerComponent('bi-aukera-handler', {
        schema: {
          contentA: { default: '' },
          contentB: { default: '' },
          videoA: { default: '' },
          videoB: { default: '' },
          buttonsRow: { default: '' },
          buttonA: { default: '' },
          buttonB: { default: '' }
        },

        init: function () {
          this.option = 'A';

          this.contentA = document.querySelector(this.data.contentA);
          this.contentB = document.querySelector(this.data.contentB);
          this.videoA = this.data.videoA ? document.querySelector(this.data.videoA) : null;
          this.videoB = this.data.videoB ? document.querySelector(this.data.videoB) : null;
          this.buttonsRow = document.querySelector(this.data.buttonsRow);
          this.buttonA = document.querySelector(this.data.buttonA);
          this.buttonB = document.querySelector(this.data.buttonB);

          this.el.addEventListener('targetFound', () => {
            if (this.buttonsRow) this.buttonsRow.style.display = 'flex';
            this.applyState(false); // ez berrezarri bideoa, jarraitu bere puntutik
          });

          this.el.addEventListener('targetLost', () => {
            if (this.buttonsRow) this.buttonsRow.style.display = 'none';
            if (this.videoA) this.videoA.pause();
            if (this.videoB) this.videoB.pause();
          });

          if (this.buttonA) this.buttonA.addEventListener('click', () => this.selectOption('A'));
          if (this.buttonB) this.buttonB.addEventListener('click', () => this.selectOption('B'));
        },

        selectOption: function (opt) {
          this.option = opt;
          this.applyState(true);
        },

        applyState: function (resetVideo) {
          if (resetVideo === undefined) resetVideo = true;

          const isA = this.option === 'A';

          if (this.contentA) this.contentA.setAttribute('visible', isA);
          if (this.contentB) this.contentB.setAttribute('visible', !isA);

          if (this.videoA) {
            if (isA) { if (resetVideo) this.videoA.currentTime = 0; this.videoA.play().catch(() => {}); }
            else { this.videoA.pause(); }
          }
          if (this.videoB) {
            if (!isA) { if (resetVideo) this.videoB.currentTime = 0; this.videoB.play().catch(() => {}); }
            else { this.videoB.pause(); }
          }

          if (this.buttonA) this.buttonA.classList.toggle('activo', isA);
          if (this.buttonB) this.buttonB.classList.toggle('activo', !isA);
        }
      });

      // Target 3: "3D Modeloa" / "Simulazioak" moduak kudeatzeko osagaia (CMC)
      AFRAME.registerComponent('modo-handler', {
        init: function () {
          this.topMode = '3d';
          this.combo = { g1: 'cm', g2: 'Mag', g3: 'Fas' };

          this.comboKeys = [
            'dmVectFrec', 'dmVectFas', 'dmMagFrec', 'dmMagFas',
            'cmVectFrec', 'cmVectFas', 'cmMagFrec', 'cmMagFas'
          ];

          this.modeloEl = document.querySelector('#cmc-modelo');

          this.simItems = {};
          this.comboKeys.forEach(key => {
            this.simItems[key] = {
              video: document.querySelector('#video-' + key),
              plane: document.querySelector('#plane-' + key)
            };
          });

          this.uiTop = document.querySelector('#fila-top');
          this.uiSim = document.querySelector('#fila-sim');
          this.btn3d = document.querySelector('#btn-3d');
          this.btnSim = document.querySelector('#btn-sim');

          this.el.addEventListener('targetFound', () => {
            this.uiTop.style.display = 'flex';
            this.applyState(false); // ez berrezarri bideoa, jarraitu bere puntutik
          });

          this.el.addEventListener('targetLost', () => {
            this.uiTop.style.display = 'none';
            this.uiSim.style.display = 'none';
            this.pauseAllVideos();
          });
        },

        comboKey: function () {
          return this.combo.g1 + this.combo.g2 + this.combo.g3;
        },

        pauseAllVideos: function () {
          Object.values(this.simItems).forEach(item => item.video.pause());
        },

        setTopMode: function (mode) {
          this.topMode = mode;
          this.applyState(true);
        },

        setGrupo: function (grupo, valor) {
          this.combo[grupo] = valor;
          this.applyState(true);
        },

        applyState: function (resetVideo) {
          if (resetVideo === undefined) resetVideo = true;

          const show3d = this.topMode === '3d';
          const showSim = this.topMode === 'sim';

          this.modeloEl.setAttribute('visible', show3d);
          this.uiSim.style.display = showSim ? 'flex' : 'none';

          if (!showSim) {
            this.pauseAllVideos();
            Object.values(this.simItems).forEach(item => item.plane.setAttribute('visible', false));
          } else {
            const activeKey = this.comboKey();
            Object.entries(this.simItems).forEach(([key, item]) => {
              const active = key === activeKey;
              item.plane.setAttribute('visible', active);
              if (active) {
                if (resetVideo) item.video.currentTime = 0;
                item.video.play().catch(() => {});
              } else {
                item.video.pause();
              }
            });
          }

          this.btn3d.classList.toggle('activo', show3d);
          this.btnSim.classList.toggle('activo', showSim);
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      * { touch-action: none; }

      #fila-top,
      #fila-sim,
      .fila-opciones {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        justify-content: center;
        gap: 16px;
        z-index: 999;
        touch-action: auto;
      }

      #fila-top,
      .fila-opciones { bottom: 24px; }

      #fila-sim { bottom: 90px; flex-direction: column; align-items: center; gap: 10px; }

      .grupo-botoiak { display: flex; gap: 10px; }

      #fila-top button,
      .fila-opciones button,
      .grupo-botoiak button {
        padding: 10px 22px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.85);
        color: #222;
        touch-action: auto;
      }

      #fila-top button.activo,
      .fila-opciones button.activo,
      .grupo-botoiak button.activo {
        background: #2b7cff;
        color: #fff;
      }

      /* Blokeo / eskaneo botoia */
      #btn-blokeo {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        padding: 10px 24px;
        border: none;
        border-radius: 22px;
        font-weight: bold;
        font-size: 14px;
        color: #fff;
        touch-action: auto;
      }
      #btn-blokeo.eskaneatzen { background: #2ecc71; }
      #btn-blokeo.blokeatuta { background: #e74c3c; }

      /* Bilatzen ari dela adierazteko etiketa propioa (MindAR-en UI nagusia ordezkatzen du) */
      #bilaketa-adierazlea {
        display: none;
        position: fixed;
        top: 66px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 998;
        padding: 6px 16px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; uiLoading: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Target 0: Kotxia -->
        <video id="video-kotxia" src="./Kotxia.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>

        <!-- Target 1: EMI (modeloa / bideoa) -->
        <a-asset-item id="emiRealModelo" src="./EMIReal.glb"></a-asset-item>
        <video id="video-emifilter" src="./EMIfilter.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>

        <!-- Target 2: EMIFilter modeloa -->
        <a-asset-item id="emiFilterModelo" src="./EMIFilter.glb"></a-asset-item>

        <!-- Target 3: CMC (modeloa + simulazioak) -->
        <a-asset-item id="cmcModelo" src="./CMC.glb"></a-asset-item>
        <video id="video-dmVectFrec" src="./dmVectFrec.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-dmVectFas" src="./dmVectFas.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-dmMagFrec" src="./dmMagFrec.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-dmMagFas" src="./dmMagFas.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-cmVectFrec" src="./cmVectFrec.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-cmVectFas" src="./cmVectFas.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-cmMagFrec" src="./cmMagFrec.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="video-cmMagFas" src="./cmMagFas.mp4" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>

        <!-- Target 4: Kondentsadorea (modeloa / argazkia) -->
        <a-asset-item id="condModelo" src="./Cond.glb"></a-asset-item>
        <img id="kondents0Img" src="./Kondents0.jpg" crossorigin="anonymous" />

        <!-- Target 5: bi argazki -->
        <img id="kondents1Img" src="./Kondents1.jpg" crossorigin="anonymous" />
        <img id="kondents2Img" src="./Kondents2.jpg" crossorigin="anonymous" />
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-light type="directional" position="1 2 1" intensity="1.0"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Kotxia bideoa -->
      <a-entity id="target-kotxia" mindar-image-target="targetIndex: 0" video-handler="videoSelector: #video-kotxia">
        <a-video
          src="#video-kotxia"
          width="2.4" height="1.32"
          position="0 0 0" rotation="0 0 0"
          billboard
          pinch-scale="targetSelector: #target-kotxia; minScale: 0.3; maxScale: 5">
        </a-video>
      </a-entity>

      <!-- Target 1: EMI - modeloa edo bideoa, botoi bidez -->
      <a-entity
        id="target-emi"
        mindar-image-target="targetIndex: 1"
        bi-aukera-handler="contentA: #emi-modelo; contentB: #emi-video-plane; videoB: #video-emifilter; buttonsRow: #fila-emi; buttonA: #btn-emi-3d; buttonB: #btn-emi-bideoa">

        <a-gltf-model
          id="emi-modelo"
          src="#emiRealModelo"
          position="0 0 0"
          scale="1.5 1.5 1.5"
          rotation="0 0 0"
          visible="true"
          touch-gestures="targetSelector: #target-emi; rotationFactor: 6; minScale: 0.1; maxScale: 10; panFactor: 0.02">
        </a-gltf-model>

        <a-video
          id="emi-video-plane"
          src="#video-emifilter"
          width="1.5" height="0.828"
          position="0 0 0" visible="false"
          billboard
          pinch-scale="targetSelector: #target-emi; minScale: 0.3; maxScale: 5">
        </a-video>
      </a-entity>

      <!-- Target 2: EMIFilter modeloa -->
      <a-entity id="target-emifilter" mindar-image-target="targetIndex: 2">
        <a-gltf-model
          src="#emiFilterModelo"
          position="0 0 0"
          scale="6 6 6"
          rotation="0 0 0"
          center-model
          touch-gestures="targetSelector: #target-emifilter; rotationFactor: 6; minScale: 0.1; maxScale: 20; panFactor: 0.02">
        </a-gltf-model>
      </a-entity>

      <!-- Target 3: 3D Modeloa (CMC) edo Simulazioak (8 bideo) -->
      <a-entity id="target-modo" mindar-image-target="targetIndex: 3" modo-handler>

        <a-gltf-model
          id="cmc-modelo"
          src="#cmcModelo"
          position="0 0 0"
          scale="0.01 0.01 0.01"
          rotation="0 0 0"
          visible="true"
          touch-gestures="targetSelector: #target-modo; rotationFactor: 6; minScale: 0.1; maxScale: 10; panFactor: 0.02">
        </a-gltf-model>

        <a-video id="plane-dmVectFrec" src="#video-dmVectFrec" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-dmVectFas" src="#video-dmVectFas" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-dmMagFrec" src="#video-dmMagFrec" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-dmMagFas" src="#video-dmMagFas" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-cmVectFrec" src="#video-cmVectFrec" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-cmVectFas" src="#video-cmVectFas" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-cmMagFrec" src="#video-cmMagFrec" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>
        <a-video id="plane-cmMagFas" src="#video-cmMagFas" width="1.5" height="0.828" position="0 0 0" visible="false" billboard pinch-scale="targetSelector: #target-modo"></a-video>

      </a-entity>

      <!-- Target 4: Kondentsadorea - modeloa edo argazkia, botoi bidez -->
      <a-entity
        id="target-kondentsadorea"
        mindar-image-target="targetIndex: 4"
        bi-aukera-handler="contentA: #cond-modelo; contentB: #kondents0-plane; buttonsRow: #fila-kondentsadorea; buttonA: #btn-kond-3d; buttonB: #btn-kond-foto">

        <a-gltf-model
          id="cond-modelo"
          src="#condModelo"
          position="0 0 0"
          scale="0.02 0.02 0.02"
          rotation="0 0 0"
          visible="true"
          center-model
          touch-gestures="targetSelector: #target-kondentsadorea; rotationFactor: 6; minScale: 0.1; maxScale: 10; panFactor: 0.02">
        </a-gltf-model>

        <a-image
          id="kondents0-plane"
          src="#kondents0Img"
          width="1.6" height="1.2"
          position="0 0 0" visible="false"
          billboard
          pinch-scale="targetSelector: #target-kondentsadorea; minScale: 0.3; maxScale: 5">
        </a-image>
      </a-entity>

      <!-- Target 5: bi argazki, botoi bidez (bata bestearen ordez) -->
      <a-entity
        id="target-kondents-parea"
        mindar-image-target="targetIndex: 5"
        bi-aukera-handler="contentA: #kondents1-plane; contentB: #kondents2-plane; buttonsRow: #fila-kondents-parea; buttonA: #btn-kondents1; buttonB: #btn-kondents2">

        <a-image
          id="kondents1-plane"
          src="#kondents1Img"
          width="1.6" height="1.2"
          position="0 0 0" visible="true"
          billboard
          pinch-scale="targetSelector: #target-kondents-parea; minScale: 0.3; maxScale: 5">
        </a-image>
        <a-image
          id="kondents2-plane"
          src="#kondents2Img"
          width="1.6" height="1.2"
          position="0 0 0" visible="false"
          billboard
          pinch-scale="targetSelector: #target-kondents-parea; minScale: 0.3; maxScale: 5">
        </a-image>
      </a-entity>

    </a-scene>

    <!-- Blokeo / eskaneo botoia -->
    <button id="btn-blokeo" class="eskaneatzen">Eskaneatzen</button>
    <div id="bilaketa-adierazlea">Bilatzen...</div>

    <!-- Target 1 botoiak: 3D Eredua / Bideoa -->
    <div id="fila-emi" class="fila-opciones">
      <button id="btn-emi-3d" class="activo">3D Eredua</button>
      <button id="btn-emi-bideoa">Bideoa</button>
    </div>

    <!-- Target 3 botoiak: 3D Modeloa / Simulazioak -->
    <div id="fila-top">
      <button id="btn-3d" class="activo">3D Modeloa</button>
      <button id="btn-sim">Simulazioak</button>
    </div>

    <!-- Target 3 simulazio taldeak: CM/DM, Mag/Bekt, Fase/Frec -->
    <div id="fila-sim">
      <div class="grupo-botoiak">
        <button data-grupo="g1" data-valor="cm" class="activo">CM</button>
        <button data-grupo="g1" data-valor="dm">DM</button>
      </div>
      <div class="grupo-botoiak">
        <button data-grupo="g2" data-valor="Mag" class="activo">Mag</button>
        <button data-grupo="g2" data-valor="Vect">Bekt</button>
      </div>
      <div class="grupo-botoiak">
        <button data-grupo="g3" data-valor="Fas" class="activo">Fase</button>
        <button data-grupo="g3" data-valor="Frec">Frek</button>
      </div>
    </div>

    <!-- Target 4 botoiak: 3D Eredua / Kondentsadoreak -->
    <div id="fila-kondentsadorea" class="fila-opciones">
      <button id="btn-kond-3d" class="activo">3D Eredua</button>
      <button id="btn-kond-foto">Kondentsadoreak</button>
    </div>

    <!-- Target 5 botoiak: Argazkia 1 / Argazkia 2 -->
    <div id="fila-kondents-parea" class="fila-opciones">
      <button id="btn-kondents1" class="activo">Argazkia 1</button>
      <button id="btn-kondents2">Argazkia 2</button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const targetModo = document.querySelector('#target-modo');
        const getComp = () => targetModo.components['modo-handler'];

        document.querySelector('#btn-3d').addEventListener('click', () => getComp().setTopMode('3d'));
        document.querySelector('#btn-sim').addEventListener('click', () => getComp().setTopMode('sim'));

        document.querySelectorAll('#fila-sim button').forEach(btn => {
          btn.addEventListener('click', () => {
            const grupo = btn.dataset.grupo;
            const valor = btn.dataset.valor;

            getComp().setGrupo(grupo, valor);

            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
          });
        });

        // Blokeo / eskaneo botoia: MindAR-en tracking-a pausatu/berrabiarazi
        let blokeatuta = false;
        const btnBlokeo = document.querySelector('#btn-blokeo');
        const sceneEl = document.querySelector('a-scene');

        // Target guztien IDak, eskaneoa berrabiaraztean guztiak "galdu" bezala
        // markatzeko eta gainjartzerik ez izateko
        const targetIds = [
          'target-kotxia', 'target-emi', 'target-emifilter',
          'target-modo', 'target-kondentsadorea', 'target-kondents-parea'
        ];

        const resetAllTargets = () => {
          targetIds.forEach(id => {
            const targetEl = document.getElementById(id);
            if (!targetEl) return;
            targetEl.object3D.visible = false;
            targetEl.dispatchEvent(new CustomEvent('targetLost'));
          });
        };

        // "Bilatzen..." adierazlea: ez dago blokeatuta ETA ez da target bat ere ikusten denean
        const adierazlea = document.querySelector('#bilaketa-adierazlea');
        const aurkitutaState = {};
        targetIds.forEach(id => { aurkitutaState[id] = false; });

        const eguneratuAdierazlea = () => {
          const edozeinAurkituta = Object.values(aurkitutaState).some(v => v);
          adierazlea.style.display = (!blokeatuta && !edozeinAurkituta) ? 'block' : 'none';
        };

        targetIds.forEach(id => {
          const targetEl = document.getElementById(id);
          if (!targetEl) return;
          targetEl.addEventListener('targetFound', () => {
            aurkitutaState[id] = true;
            eguneratuAdierazlea();
          });
          targetEl.addEventListener('targetLost', () => {
            aurkitutaState[id] = false;
            eguneratuAdierazlea();
          });
        });

        eguneratuAdierazlea();

        btnBlokeo.addEventListener('click', () => {
          const mindarSystem = sceneEl.systems['mindar-image-system'];
          if (!mindarSystem) {
            console.warn('mindar-image-system ez da aurkitu; egiaztatu MindAR bertsioa.');
            return;
          }

          blokeatuta = !blokeatuta;

          if (blokeatuta) {
            mindarSystem.pause(true); // true = kamera bideoa martxan mantendu
            btnBlokeo.textContent = 'Blokeatuta';
            btnBlokeo.classList.remove('eskaneatzen');
            btnBlokeo.classList.add('blokeatuta');
          } else {
            resetAllTargets();
            mindarSystem.unpause();
            btnBlokeo.textContent = 'Eskaneatzen';
            btnBlokeo.classList.remove('blokeatuta');
            btnBlokeo.classList.add('eskaneatzen');
          }

          eguneratuAdierazlea();
        });
      });
    </script>
  </body>
</html>
