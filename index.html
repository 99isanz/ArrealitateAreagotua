<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Librerías base (A-Frame y MindAR) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Librería para controles táctiles (NUEVA) -->
    <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector/dist/aframe-gesture-detector.min.js"></script>
    
    <!-- Consola de depuración (la ocultamos por defecto, toca el botón para verla) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init(); eruda.hide();</script>

    <style>
      body { margin: 0; overflow: hidden; }
      /* Evita que el navegador móvil muestre el menú de selección de texto */
      * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body>
    <!-- 
      Añadimos 'gesture-detector' en la escena para activar los gestos táctiles.
      También actualizamos 'renderer' para corregir la advertencia de iluminación.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gesture-detector>

      <a-assets>
        <a-asset-item id="miModelo" src="./modelo.glb"></a-asset-item>
      </a-assets>

      <!-- Nueva iluminación más realista (puedes ajustar 'intensity') -->
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          Añadimos 'gesture-handler' y 'class="clickable"'. 
          Esto activa la interacción para este modelo específico.
          Puedes ajustar 'minScale' y 'maxScale' para el zoom.
        -->
        <a-gltf-model 
          src="#miModelo" 
          position="0 0 0" 
          scale="0.01 0.01 0.01" 
          rotation="0 0 0"
          class="clickable"
          gesture-handler="minScale: 0.001; maxScale: 10">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
