<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame eta MindAR libreriak kargatu -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Zure bideoaren helbidea -->
        <video id="kartel-bideoa" src="./bideoa.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Karteleko lehen irudia (target 0) detektatzean bideoa erakutsi -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#kartel-bideoa" width="1" height="0.552" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      // Mugikorraren pantaila ukitzean bideoa erreproduzitzeko (nabigatzaileen audio-blokeoagatik)
      document.body.addEventListener('click', () => {
        const video = document.querySelector('#kartel-bideoa');
        if (video.paused) {
          video.play();
        }
      });
    </script>
  </body>
</html>
